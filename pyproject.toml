[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-FilamentScale"
version = "0.5.3"
description = "Shows spool weights from a FilamentScale WiFi scale in the OctoPrint sidebar"
authors = [
    {name = "Jakub Jelínek", email = "jakub.jelinek@bliksoft.cz"}
]
readme = {file = "README.md", content-type = "text/markdown"}
# the license is set in setup.py, to stay compatible with setuptools<77
dynamic = [
    "license"
]

requires-python = ">=3.7, <4"

# any additional requirements (besides OctoPrint) should be listed here
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_filamentscale",
    "octoprint_filamentscale.*"
]

[project.entry-points."octoprint.plugin"]
filamentscale = "octoprint_filamentscale"

[project.urls]
Homepage = "https://github.com/jelinj8/plugin-OctoPrint-FilamentScale"
Firmware = "https://github.com/jelinj8/firmware-FilamentScale"
